<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campaigns – Kunash Digital Marketing CRM</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <style type="text/tailwindcss">
    @layer components {
      .card { @apply min-w-0 overflow-hidden rounded-xl border border-line bg-card; }
      .ico { @apply grid h-8 w-8 shrink-0 place-items-center rounded-lg border border-line text-mute; }
      .ttl { @apply truncate text-xs text-mute; }
      .av { @apply grid h-8 w-8 shrink-0 place-items-center rounded-full bg-soft text-[11px] font-bold text-brand; }
      .btn-o { @apply inline-flex h-8 shrink-0 items-center gap-1.5 rounded-lg border border-brand px-3 text-xs font-medium text-brand hover:bg-soft; }
      .btn-p { @apply inline-flex h-8 shrink-0 items-center gap-1.5 rounded-lg bg-brand px-3 text-xs font-semibold text-white; }
      .sel { @apply h-8 min-w-0 rounded-lg border border-line bg-card px-2 text-xs text-ink; }
      .ibtn { @apply grid h-7 w-7 shrink-0 place-items-center rounded-md border border-line text-mute hover:bg-hov hover:text-ink; }
    }
  </style>
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-bg font-sans text-sm text-ink antialiased">

  <div id="sidebar-root"></div>

  <div class="min-w-0 transition-[margin] duration-200 lg:ml-[var(--sw)]">
    <div id="topbar-root"></div>

    <main class="p-3 sm:p-5">
      <div class="cq mx-auto max-w-[1500px] space-y-3">

        <div class="flex flex-wrap items-end justify-between gap-2">
          <div class="min-w-0">
            <h1 class="truncate text-xl font-bold">Campaigns</h1>
            <p class="text-xs text-mute sm:text-sm">Plan, publish and track campaigns. Only approved creatives can go live.</p>
          </div>
          <div class="flex flex-wrap gap-2"><button class="btn-o" data-form="googleAd"><i data-lucide="search" class="h-3.5 w-3.5"></i>Run Google ad</button><button class="btn-o" data-form="waCampaign"><i data-lucide="message-circle" class="h-3.5 w-3.5"></i>Run WhatsApp campaign</button><button class="btn-p" data-form="campaign"><i data-lucide="plus" class="h-3.5 w-3.5"></i>New campaign</button></div>
        </div>

        <section id="kpis" class="kp"></section>

        <div class="card">
          <div id="tabs" class="flex gap-1 overflow-x-auto border-b border-line px-3 pt-2" role="tablist"></div>
          <div class="flex flex-wrap items-center gap-2 border-b border-line p-3">
            <label class="flex h-8 min-w-[160px] flex-1 items-center gap-2 rounded-lg border border-line px-2.5 text-mute">
              <i data-lucide="search" class="h-3.5 w-3.5 shrink-0"></i>
              <input id="q" aria-label="Search campaigns" placeholder="Search by campaign or client" class="w-full min-w-0 bg-transparent text-xs text-ink outline-none">
            </label>
            <select id="fc" class="sel" aria-label="Client"></select>
            <select id="fp" class="sel" aria-label="Platform"><option value="">All platforms</option><option>Meta</option><option>Google Ads</option><option>Meta + Google</option><option>WhatsApp</option><option>LinkedIn</option></select>
            <select id="so" class="sel" aria-label="Sort"><option value="new">Sort: Newest</option><option value="name">Sort: Name</option><option value="budget">Sort: Budget</option><option value="spent">Sort: Spend</option><option value="leads">Sort: Leads</option></select>
            <div id="vt" class="flex shrink-0 rounded-lg bg-bg p-0.5">
              <button data-v="table" aria-label="Table view" class="grid h-7 w-7 place-items-center rounded-md"><i data-lucide="list" class="h-4 w-4"></i></button>
              <button data-v="cards" aria-label="Card view" class="grid h-7 w-7 place-items-center rounded-md"><i data-lucide="layout-grid" class="h-4 w-4"></i></button>
            </div>
          </div>
          <div id="list" class="min-w-0"></div>
          <div id="pager" class="flex flex-wrap items-center justify-between gap-2 border-t border-line px-3 py-2 text-xs text-mute"></div>
        </div>

      </div>
    </main>
  </div>

  <script src="/component/modals.js"></script>
  <script src="/component/sidebar.js"></script>
  <script src="/component/topbar.js"></script>
  <script src="/js/campaigns.js"></script>
</body>
</html>
