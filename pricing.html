<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agency pricing – AdDesk CRM</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <style type="text/tailwindcss">
    @layer components {
      .card { @apply min-w-0 overflow-hidden rounded-xl border border-line bg-card; }
      .ch { @apply flex min-w-0 items-center gap-2.5 px-3 pt-3; }
      .ico { @apply grid h-8 w-8 shrink-0 place-items-center rounded-lg border border-line text-mute; }
      .ttl { @apply truncate text-xs text-mute; }
      .val { @apply flex items-center gap-1.5 text-base font-bold leading-tight; }
      .cb { @apply p-3; }
      .btn-o { @apply inline-flex h-8 shrink-0 items-center gap-1.5 rounded-lg border border-brand px-3 text-xs font-medium text-brand hover:bg-soft; }
      .btn-p { @apply inline-flex h-8 shrink-0 items-center gap-1.5 rounded-lg bg-brand px-3 text-xs font-semibold text-white; }
      .sel { @apply h-8 min-w-0 rounded-lg border border-line bg-card px-2 text-xs text-ink; }
      .ibtn { @apply grid h-7 w-7 shrink-0 place-items-center rounded-md border border-line text-mute hover:bg-hov hover:text-ink; }
      .av { @apply grid h-8 w-8 shrink-0 place-items-center rounded-full bg-soft text-[11px] font-bold text-brand; }
    }
  </style>
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-bg font-sans text-sm text-ink antialiased">

  <div id="sidebar-root"></div>

  <div class="min-w-0 transition-[margin] duration-200 lg:ml-[var(--sw)]">
    <div id="topbar-root"></div>

    <main class="p-3 sm:p-5">
      <div class="cq mx-auto max-w-[1500px] space-y-3">

        <div class="flex flex-wrap items-end justify-between gap-2">
          <div class="min-w-0">
            <h1 class="truncate text-xl font-bold">Agency pricing</h1>
            <p class="text-xs text-mute sm:text-sm">Your service plans, add-ons and what each client pays. Retainer invoices use these prices.</p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button class="btn-o" data-form="addon"><i data-lucide="puzzle" class="h-3.5 w-3.5"></i>New add-on</button>
            <button class="btn-p" data-form="plan"><i data-lucide="plus" class="h-3.5 w-3.5"></i>New plan</button>
          </div>
        </div>

        <section id="kpis" class="kp"></section>

        <div class="card">
          <div class="ch"><div class="ico"><i data-lucide="layers" class="h-4 w-4"></i></div><div class="min-w-0"><div class="ttl">Service plans</div><div id="pv" class="val"></div></div></div>
          <div id="plans" class="cb"></div>
        </div>

        <section class="rw r21">
          <div class="card">
            <div class="ch"><div class="ico"><i data-lucide="building-2" class="h-4 w-4"></i></div><div class="min-w-0"><div class="ttl">Client pricing</div><div class="val">What each client pays</div></div></div>
            <div class="flex flex-wrap items-center gap-2 p-3">
              <label class="flex h-8 min-w-[150px] flex-1 items-center gap-2 rounded-lg border border-line px-2.5 text-mute"><i data-lucide="search" class="h-3.5 w-3.5 shrink-0"></i><input id="q" aria-label="Search clients" placeholder="Search by client" class="w-full min-w-0 bg-transparent text-xs text-ink outline-none"></label>
              <select id="fp" class="sel" aria-label="Plan"></select>
              <button id="cu" class="flex h-8 shrink-0 items-center gap-1.5 rounded-lg border border-line px-2.5 text-xs font-medium text-mute hover:bg-hov hover:text-ink">Custom pricing only</button>
            </div>
            <div id="list" class="min-w-0 border-t border-line"></div>
            <div id="pager" class="flex flex-wrap items-center justify-between gap-2 border-t border-line px-3 py-2 text-xs text-mute"></div>
          </div>
          <div class="card">
            <div class="ch"><div class="ico"><i data-lucide="history" class="h-4 w-4"></i></div><div class="min-w-0"><div class="ttl">Price history</div><div class="val">Recent changes</div></div></div>
            <div id="hist" class="cb"></div>
          </div>
        </section>

        <div class="card">
          <div class="ch"><div class="ico"><i data-lucide="puzzle" class="h-4 w-4"></i></div><div class="min-w-0"><div class="ttl">Add-ons</div><div class="val">Extra services you can bill</div></div></div>
          <divd=" iaddons" class="cb"></div>
        </div>

      </div>
    </main>
  </div>

  <script src="/component/modals.js"></script>
  <script src="/component/sidebar.js"></script>
  <script src="/component/topbar.js"></script>
  <script src="/js/pricing.js"></script>
</body>
</html>
