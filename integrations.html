<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Integrations – AdDesk CRM</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <style type="text/tailwindcss">
    @layer components {
      .card { @apply min-w-0 overflow-hidden rounded-xl border border-line bg-card; }
      .ico { @apply grid h-8 w-8 shrink-0 place-items-center rounded-lg border border-line text-mute; }
      .ttl { @apply truncate text-xs text-mute; }
      .av { @apply grid h-6 w-6 shrink-0 place-items-center rounded-full bg-soft text-[10px] font-bold text-brand; }
      .btn-o { @apply inline-flex h-8 shrink-0 items-center gap-1.5 rounded-lg border border-brand px-3 text-xs font-medium text-brand hover:bg-soft; }
      .btn-p { @apply inline-flex h-8 shrink-0 items-center gap-1.5 rounded-lg bg-brand px-3 text-xs font-semibold text-white; }
      .btn-d { @apply inline-flex h-8 shrink-0 items-center gap-1.5 rounded-lg border border-[var(--red)] px-3 text-xs font-medium text-[var(--red)] hover:bg-[var(--redbg)]; }
      .sel { @apply h-8 min-w-0 rounded-lg border border-line bg-card px-2 text-xs text-ink; }
      .ibtn { @apply grid h-7 w-7 shrink-0 place-items-center rounded-md border border-line text-mute hover:bg-hov hover:text-ink; }
    }
  </style>
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-bg font-sans text-sm text-ink antialiased">

  <div id="sidebar-root"></div>

  <div class="min-w-0 transition-[margin] duration-200 lg:ml-[var(--sw)]">
    <div id="topbar-root"></div>

    <main class="p-3 sm:p-5">
      <div class="cq mx-auto max-w-[1500px] space-y-3">

        <div class="flex flex-wrap items-end justify-between gap-2">
          <div class="min-w-0">
            <h1 class="truncate text-xl font-bold">Integrations</h1>
            <p class="text-xs text-mute sm:text-sm">Connect client ad accounts and the third-party services the CRM depends on. Clients never share passwords; they sign in on the official Meta or Google screen.</p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button class="btn-o" data-act="syncall"><i data-lucide="refresh-cw" class="h-3.5 w-3.5"></i>Sync all</button>
            <button class="btn-p" data-act="connect"><i data-lucide="plug-zap" class="h-3.5 w-3.5"></i>Connect account</button>
          </div>
        </div>

        <div id="alert"></div>
        <section id="kpis" class="kp"></section>

        <div class="card">
          <div id="tabs" class="flex gap-1 overflow-x-auto border-b border-line px-3 pt-2" role="tablist"></div>
          <div id="view" class="min-w-0"></div>
        </div>

      </div>
    </main>
  </div>

  <script src="/component/modals.js"></script>
  <script src="/component/sidebar.js"></script>
  <script src="/component/topbar.js"></script>
  <script src="/js/integrations.js"></script>
</body>
</html>
